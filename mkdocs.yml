site_name: Cahaba Studio Documentation
site_url: https://docs.invictuscad.com
repo_url: https://github.com/invictuscockpits/invictuscad-docs
repo_name: invictuscockpits/invictuscad-docs
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://cahaba3d.com
    - icon: fontawesome/solid/envelope
      link: mailto:support@cahaba3d.com

